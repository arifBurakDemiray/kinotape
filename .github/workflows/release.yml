# Builds Kinotape for macOS and Windows and attaches both to a GitHub Release whenever a version tag is pushed.
# Release a version with: git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # build.sh needs lipo, sips and iconutil, which only macOS has.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Kinotape-macOS.zip dist/Kinotape.exe --title "Kinotape $GITHUB_REF_NAME" --generate-notes
