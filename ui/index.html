          <label class="field"><span>Domain or workgroup (usually empty)</span><input id="shareDomain" type="text" value="${esc(s.domain)}" spellcheck="false"></label>
        </div>
        ${error}
        <div class="sheet-end"><button class="btn" type="button" data-share="back-server">Back</button>
          <button class="btn primary" type="button" data-share="connect" ${s.busy ? 'disabled' : ''}>${busy}Connect</button></div>`;
    } else if (s.step === 'share') {
      const list = s.shares.length
        ? s.shares.map((item) => `<li><button class="pick" type="button" data-pick-share="${esc(item.name)}">${ICON.share}<span><strong>${esc(item.name)}</strong><span>${esc(item.comment || 'Shared folder')}</span></span></button></li>`).join('')
        : '<li class="hint">This account can’t see any shared folders on the server.</li>';
      html = `<h2 id="shareTitle">Pick a share</h2>
        <p class="hint">Shared folders on ${esc(s.host)}.</p>
        <ul class="pick-list">${list}</ul>
        <label class="field"><span>Or type the share’s name</span>
          <span class="inline"><input id="shareName" type="text" placeholder="Media" spellcheck="false" autocomplete="off"><button class="btn" type="button" data-share="named">Open</button></span></label>
        ${error}
        <div class="sheet-end"><button class="btn" type="button" data-share="back-login">Back</button><span></span></div>`;
    } else {
      const parts = s.dir ? s.dir.split('/') : [];
      const crumbs = [`<button type="button" data-crumb="">${esc(s.share)}</button>`]
        .concat(parts.map((part, i) => `<span>/</span><button type="button" data-crumb="${esc(parts.slice(0, i + 1).join('/'))}">${esc(part)}</button>`)).join('');
      const list = s.busy
        ? '<li class="hint"><span class="spinner"></span> Opening…</li>'
        : s.dirs.length
          ? s.dirs.map((d) => `<li><button class="pick" type="button" data-open-dir="${esc(d)}">${ICON.folder}<span><strong>${esc(d)}</strong></span></button></li>`).join('')
          : '<li class="hint">No folders inside. Add this one, or go back up.</li>';
      html = `<h2 id="shareTitle">Choose the folder</h2>
        <p class="hint">Kinotape scans the folder you add and everything inside it.</p>
        <div class="crumbs">${crumbs}</div>
        <ul class="pick-list">${list}</ul>
        ${error}
        <div class="sheet-end"><button class="btn" type="button" data-share="back-share">Back</button>
          <button class="btn primary" type="button" data-share="add" ${s.busy ? 'disabled' : ''}>Add ${esc(s.dir ? s.dir.split('/').pop() : s.share)}</button></div>`;
    }
    $('#shareSheet').innerHTML = html;
  }

  /** Read the sign-in fields into the dialog state. */
  function readShareLogin() {
    share.guest = !!($('#shareGuest') && $('#shareGuest').checked);
    share.user = share.guest ? '' : ($('#shareUser') ? $('#shareUser').value.trim() : share.user);
    share.password = share.guest ? '' : ($('#sharePassword') ? $('#sharePassword').value : share.password);
    share.domain = share.guest ? '' : ($('#shareDomain') ? $('#shareDomain').value.trim() : share.domain);
  }

  /** The login part of every share request. */
  function shareLogin(extra) {
    return Object.assign({ host: share.host, user: share.user, password: share.password, domain: share.domain }, extra || {});
  }

  /** List the folders inside the chosen share folder. */
  async function loadShareDirs(dir) {
    share.dir = dir;
    share.busy = true;
    share.error = '';
    renderShare();
    try {
      share.dirs = await api('/api/smb/dirs', shareLogin({ share: share.share, dir }));
    } catch (err) {
      share.dirs = [];
      share.error = err.message;
    }
    share.busy = false;
    renderShare();
  }

  /** Handle a button inside the network share dialog. */
  async function shareAction(action) {
    share.error = '';
    if (action === 'cancel') return $('#shareDialog').close();
    if (action === 'rescan') return discoverServers();
    if (action === 'to-login') {
      share.host = $('#shareHost').value.trim() || share.host;
      if (!share.host) {
        share.error = 'Pick a server, or type its name or address.';
        return renderShare();
      }
      share.step = 'login';
      renderShare();
      const field = $('#shareUser');
      if (field) field.focus();
      return;
    }
    if (action === 'back-server') { share.step = 'server'; return renderShare(); }
    if (action === 'back-login') { share.step = 'login'; return renderShare(); }
    if (action === 'back-share') { share.step = 'share'; return renderShare(); }
    if (action === 'connect') {
      readShareLogin();
      share.busy = true;
      renderShare();
      try {
        share.shares = await api('/api/smb/shares', shareLogin());
      } catch (err) {
        share.shares = [];
        share.error = `${err.message} You can still type the share’s name.`;
      }
      share.step = 'share';
      share.busy = false;
      return renderShare();
    }
    if (action === 'named') {
      const name = $('#shareName').value.trim().replace(/^[\\/]+|[\\/]+$/g, '');
      if (!name) return;
      share.share = name;
      share.step = 'dir';
      return loadShareDirs('');
    }
    if (action === 'add') {
      share.busy = true;
      renderShare();
      try {
        await api('/api/sources/add', shareLogin({ kind: 'smb', share: share.share, dir: share.dir }));
        $('#shareDialog').close();
        toast(`Added ${share.dir ? share.dir.split('/').pop() : share.share}. Scanning…`);
        await refresh(true);
      } catch (err) {
        share.error = err.message;
        share.busy = false;
        renderShare();
      }
    }
  }

  /** Point the page at a new address, redrawing it. */
  function go(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  document.addEventListener('click', (event) => {
    if (!$('#subsMenu').hidden && !event.target.closest('.p-menu-wrap')) toggleSubtitleMenu(false);
    const el = event.target.closest('[data-play],[data-player],[data-sub],[data-mark],[data-action],[data-group],[data-genre],[data-remove],[data-share],[data-server],[data-pick-share],[data-open-dir],[data-crumb]');
    if (!el) return;
    const d = el.dataset;
    if (d.sub !== undefined) chooseSubtitle(Number(d.sub));
    else if (d.play) startEpisode(d.play);
    else if (d.player) playerAction(d.player);
    else if (d.mark) toggleWatched(d.mark);
    else if (d.group) {
      view.group = d.group;
      view.genre = '';
      try { localStorage.setItem('kinotape.group', d.group); } catch (err) { view.group = d.group; }
      render();
    } else if (d.genre !== undefined) {
      view.group = 'genre';
      view.genre = view.genre === d.genre ? '' : d.genre;
      view.query = '';
      $('#search').value = '';
      go('#/');
      render();
    } else if (d.remove) removeSource(d.remove);
    else if (d.share) shareAction(d.share);
    else if (d.server !== undefined) { share.host = d.server; shareAction('to-login'); }
    else if (d.pickShare !== undefined) { share.share = d.pickShare; share.step = 'dir'; loadShareDirs(''); }
    else if (d.openDir !== undefined) loadShareDirs(share.dir ? `${share.dir}/${d.openDir}` : d.openDir);
    else if (d.crumb !== undefined) loadShareDirs(d.crumb);
    else if (d.action === 'pick-folder') addFolder();
    else if (d.action === 'add-path') addFolder($('#folderPath').value);
    else if (d.action === 'add-share') openShareWizard();
    else if (d.action === 'rescan') api('/api/rescan', {}).then(() => refresh(true)).catch((err) => toast(err.message));
    else if (d.action === 'save-tmdb') saveSetting({ tmdb_key: $('#tmdbKey').value }, $('#tmdbKey').value.trim() ? 'TMDB key saved' : 'TMDB key removed');
    else if (d.action === 'quit') quitApp();
    else if (d.action === 'close-cant-play') $('#cantPlay').close();
    else if (d.action === 'open-external') openExternally();
  });
  document.addEventListener('change', (event) => {
    if (event.target.id === 'autoplayToggle') saveSetting({ autoplay: event.target.checked }, event.target.checked ? 'The next episode will start by itself' : 'Playback will stop after each episode');
    if (event.target.id === 'artworkToggle') saveSetting({ artwork: event.target.checked }, event.target.checked ? 'Looking up posters and genres' : 'Posters and genres are off');
    if (event.target.id === 'shareGuest') { readShareLogin(); renderShare(); }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && event.target.id === 'folderPath') addFolder(event.target.value);
    if (event.key === 'Enter' && event.target.id === 'shareHost') shareAction('to-login');
    if (event.key === 'Enter' && event.target.id === 'shareName') shareAction('named');
    if (event.key === 'Enter' && ['shareUser', 'sharePassword', 'shareDomain'].includes(event.target.id)) shareAction('connect');
    if (event.key === '/' && $('#player').hidden && !/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) && !document.querySelector('dialog[open]')) {
      event.preventDefault();
      $('#search').focus();
    }
  });
  $('#search').addEventListener('input', (event) => {
    view.query = event.target.value;
    if (route().name !== 'home') go('#/');
    else render();
  });
  const videoEl = $('#video');
  videoEl.addEventListener('timeupdate', onTimeUpdate);
  videoEl.addEventListener('pause', () => { saveProgress(true); wake(); });
  videoEl.addEventListener('play', wake);
  videoEl.addEventListener('seeked', () => saveProgress(true));
  videoEl.addEventListener('ended', onEnded);
  videoEl.addEventListener('error', onVideoError);
  videoEl.addEventListener('dblclick', toggleFullscreen);
  $('#player').addEventListener('mousemove', wake);
  window.addEventListener('keydown', onPlayerKey, true);
  window.addEventListener('keyup', onPlayerKeyUp, true);
  window.addEventListener('hashchange', () => { view.introDone = false; render(); window.scrollTo(0, 0); });
  window.addEventListener('popstate', () => { if (!$('#player').hidden) teardownPlayer(); });
  window.addEventListener('pagehide', () => saveProgress(true));
  window.addEventListener('focus', () => refresh(false));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
  setInterval(() => { if (!document.hidden) refresh(false); }, 10000);
  refresh(true);
</script>
</body>
</html>
